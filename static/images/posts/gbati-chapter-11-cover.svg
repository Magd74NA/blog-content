<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0f172a"/>
  <line x1="0" y1="157" x2="1200" y2="157" stroke="#14b8a6" stroke-opacity="0.08"/>
  <line x1="0" y1="314" x2="1200" y2="314" stroke="#14b8a6" stroke-opacity="0.08"/>
  <line x1="0" y1="471" x2="1200" y2="471" stroke="#14b8a6" stroke-opacity="0.08"/>
  <text x="60" y="225" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="16" fill="#64748b" letter-spacing="2">CHAPTER 11 · BARE-METAL EMBEDDED C</text>
  <text x="60" y="310" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="76" font-weight="800" fill="#f1f5f9">ADC Driver</text>
  <text x="60" y="395" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="76" font-weight="800" fill="#f1f5f9">Light Sensor</text>
  <text x="60" y="435" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="18" fill="#94a3b8">Reading an ambient light sensor on the STM32F446RE</text>
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect x="60" y="452" width="260" height="3" rx="1.5" fill="url(#ag)"/>

  <!-- continuous analog signal being quantized -->
  <g stroke-opacity="0.06" stroke="#14b8a6" stroke-dasharray="3,5">
    <line x1="640" y1="195" x2="640" y2="360"/>
    <line x1="680" y1="195" x2="680" y2="360"/>
    <line x1="720" y1="195" x2="720" y2="360"/>
    <line x1="760" y1="195" x2="760" y2="360"/>
    <line x1="800" y1="195" x2="800" y2="360"/>
    <line x1="840" y1="195" x2="840" y2="360"/>
    <line x1="880" y1="195" x2="880" y2="360"/>
    <line x1="920" y1="195" x2="920" y2="360"/>
    <line x1="960" y1="195" x2="960" y2="360"/>
    <line x1="1000" y1="195" x2="1000" y2="360"/>
    <line x1="1040" y1="195" x2="1040" y2="360"/>
    <line x1="1080" y1="195" x2="1080" y2="360"/>
  </g>
  <!-- analog ramp -->
  <path d="M620,345 Q820,210 1080,205" fill="none" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.35"/>
  <!-- quantized stair-step (12-bit ADC samples) -->
  <path d="M620,345 H660 V330 H700 V310 H740 V288 H780 V262 H820 V240 H860 V225 H900 V214 H940 V208 H980 V205 H1080"
        fill="none" stroke="#14b8a6" stroke-width="3" stroke-linejoin="miter"/>
  <text x="850" y="380" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" fill="#14b8a6" opacity="0.5" text-anchor="middle">analog light level → 12-bit code</text>

  <!-- light meter gauge -->
  <rect x="640" y="415" width="380" height="22" rx="3" fill="none" stroke="#14b8a6" stroke-opacity="0.18" stroke-width="1.5"/>
  <g fill="#14b8a6">
    <rect x="650" y="421" width="16" height="10" rx="1" opacity="0.95"/>
    <rect x="670" y="421" width="16" height="10" rx="1" opacity="0.9"/>
    <rect x="690" y="421" width="16" height="10" rx="1" opacity="0.85"/>
    <rect x="710" y="421" width="16" height="10" rx="1" opacity="0.8"/>
    <rect x="730" y="421" width="16" height="10" rx="1" opacity="0.75"/>
    <rect x="750" y="421" width="16" height="10" rx="1" opacity="0.7"/>
    <rect x="770" y="421" width="16" height="10" rx="1" opacity="0.6"/>
    <rect x="790" y="421" width="16" height="10" rx="1" opacity="0.45"/>
    <rect x="810" y="421" width="16" height="10" rx="1" opacity="0.3"/>
    <rect x="830" y="421" width="16" height="10" rx="1" opacity="0.18"/>
  </g>
  <g fill="#14b8a6" opacity="0.12">
    <rect x="850" y="421" width="16" height="10" rx="1"/>
    <rect x="870" y="421" width="16" height="10" rx="1"/>
    <rect x="890" y="421" width="16" height="10" rx="1"/>
    <rect x="910" y="421" width="16" height="10" rx="1"/>
    <rect x="930" y="421" width="16" height="10" rx="1"/>
    <rect x="950" y="421" width="16" height="10" rx="1"/>
    <rect x="970" y="421" width="16" height="10" rx="1"/>
    <rect x="990" y="421" width="16" height="10" rx="1"/>
  </g>
  <text x="640" y="458" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" fill="#64748b">DR = 0x09A3</text>
  <text x="1020" y="458" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" fill="#64748b" text-anchor="end">0xFFF</text>

  <!-- sun / sensor glyph -->
  <circle cx="1110" cy="210" r="26" fill="url(#sun)" opacity="0.9"/>
  <g stroke="#fbbf24" stroke-width="2.5" opacity="0.75" stroke-linecap="round">
    <line x1="1110" y1="168" x2="1110" y2="178"/>
    <line x1="1110" y1="242" x2="1110" y2="252"/>
    <line x1="1068" y1="210" x2="1078" y2="210"/>
    <line x1="1142" y1="210" x2="1152" y2="210"/>
    <line x1="1082" y1="182" x2="1089" y2="189"/>
    <line x1="1131" y1="231" x2="1138" y2="238"/>
    <line x1="1138" y1="182" x2="1131" y2="189"/>
    <line x1="1089" y1="231" x2="1082" y2="238"/>
  </g>
  <text x="60" y="510" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13" fill="#64748b">PA1 · analog · ADC1_IN1 · continuous · printf back online</text>
</svg>
