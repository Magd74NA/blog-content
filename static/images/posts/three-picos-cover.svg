<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0f172a"/>
  <line x1="0" y1="157" x2="1200" y2="157" stroke="#14b8a6" stroke-opacity="0.08"/>
  <line x1="0" y1="314" x2="1200" y2="314" stroke="#14b8a6" stroke-opacity="0.08"/>
  <line x1="0" y1="471" x2="1200" y2="471" stroke="#14b8a6" stroke-opacity="0.08"/>
  <text x="60" y="225" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="16" fill="#64748b" letter-spacing="2">RASPBERRY PI PICO · RP2040 / RP2350</text>
  <text x="60" y="310" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="76" font-weight="800" fill="#f1f5f9">Three Picos,</text>
  <text x="60" y="395" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="76" font-weight="800" fill="#f1f5f9">Three Abstractions</text>
  <text x="60" y="435" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="18" fill="#94a3b8">Hand-written boot2, the SDK, and a real sensor + display</text>
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect x="60" y="452" width="260" height="3" rx="1.5" fill="url(#ag)"/>

  <!-- abstraction ladder, three rungs rising left-to-right -->
  <g font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace">
    <rect x="650" y="330" width="80" height="40" rx="3" fill="#14b8a6" fill-opacity="0.10" stroke="#14b8a6" stroke-opacity="0.35"/>
    <text x="690" y="355" font-size="11" fill="#14b8a6" text-anchor="middle" opacity="0.8">boot2</text>
    <text x="690" y="385" font-size="9" fill="#64748b" text-anchor="middle">256 B</text>

    <rect x="760" y="280" width="80" height="40" rx="3" fill="#14b8a6" fill-opacity="0.18" stroke="#14b8a6" stroke-opacity="0.5"/>
    <text x="800" y="305" font-size="11" fill="#14b8a6" text-anchor="middle" opacity="0.9">SDK</text>
    <text x="800" y="335" font-size="9" fill="#64748b" text-anchor="middle">RP2350</text>

    <rect x="870" y="230" width="80" height="40" rx="3" fill="#14b8a6" fill-opacity="0.28" stroke="#14b8a6" stroke-opacity="0.7"/>
    <text x="910" y="255" font-size="11" fill="#5eead4" text-anchor="middle">app</text>
    <text x="910" y="285" font-size="9" fill="#64748b" text-anchor="middle">LM75+TM1637</text>
  </g>
  <path d="M690,330 L800,280 L910,230" fill="none" stroke="#14b8a6" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4,4"/>

  <!-- 7-seg display showing 24.6 -->
  <g transform="translate(640,420)">
    <rect x="0" y="0" width="320" height="90" rx="6" fill="#0b1324" stroke="#14b8a6" stroke-opacity="0.25" stroke-width="1.5"/>
    <g fill="#14b8a6" fill-opacity="0.92">
      <!-- digit 1: 2 -->
      <polygon points="20,15 60,15 55,22 25,22"/>
      <polygon points="60,18 65,25 62,42 55,45 55,22"/>
      <polygon points="58,48 55,45 25,45 22,42 27,48 55,48"/>
      <polygon points="20,48 25,45 22,42 18,42 15,45"/>
      <polygon points="22,48 27,48 24,65 18,68 15,65"/>
      <!-- digit 2: 4 -->
      <polygon points="95,15 92,22 70,45 67,42 90,18"/>
      <polygon points="92,42 95,45 95,65 92,68 89,65 89,45"/>
      <polygon points="67,42 95,42 92,45 70,45"/>
      <!-- digit 3: 4 with decimal -->
      <polygon points="120,15 117,22 95,45 92,42 115,18"/>
      <polygon points="117,42 120,45 120,65 117,68 114,65 114,45"/>
      <polygon points="92,42 120,42 117,45 95,45"/>
      <circle cx="128" cy="64" r="3.2"/>
      <!-- digit 4: 6 -->
      <polygon points="155,15 158,22 180,45 183,42 160,18"/>
      <polygon points="158,48 155,45 155,65 158,68 161,65 161,48"/>
      <polygon points="160,45 188,45 185,48 163,48"/>
      <polygon points="185,42 188,45 188,65 185,68 182,65 182,45"/>
      <polygon points="160,48 163,48 160,65 158,68 155,65"/>
      <polygon points="163,45 185,42 182,45 163,45"/>
    </g>
    <g fill="#14b8a6" fill-opacity="0.06">
      <!-- dimmed segments to show the digit grid -->
      <polygon points="218,15 248,15 245,22 221,22"/>
      <polygon points="288,15 318,15 315,22 291,22"/>
    </g>
    <text x="160" y="-8" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10" fill="#64748b" text-anchor="middle">LM75 → TM1637</text>
  </g>
  <text x="60" y="510" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13" fill="#64748b">bootrom → boot2 → Reset_Handler → main · XIP @ 0x10000000</text>
</svg>
